# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Locks down the admin surface and forces an explicit frontend origin for CORS.
# Database, port and DDL strategy are all driven by environment variables (no secrets in the repo).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/budgetspace}
    username: ${DATABASE_USERNAME:budgetspace}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Prod must NOT default to a schema-dropping strategy — `create` wipes ALL data on every restart.
      # Flyway (below) owns the schema; `validate` only checks that the Flyway-built schema matches the
      # entities and fails fast on drift. Do NOT override to create/update — write a migration instead.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    # Flyway owns schema creation, so JPA must NOT defer datasource init behind the EntityManagerFactory —
    # that creates a flyway <-> entityManagerFactory circular depends-on at boot.
    defer-datasource-initialization: false
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  flyway:
    # Flyway owns the prod schema. V1__baseline.sql creates it on a fresh DB; every later change is a new
    # versioned migration. baseline-on-migrate adopts an EXISTING non-empty schema as V1 instead of failing.
    #
    # V1-V6 build the furniture schema this app no longer uses, and they stay. Two reasons, both proven
    # against a live Postgres: V6 ALTERs public.products, which only exists because V1 created it; and
    # Flyway's validate-on-migrate fails on an applied-but-missing migration, so renumbering breaks every
    # already-deployed database. The only table this app reads or writes is nail_feedback (V7).
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}
  # Behind a TLS-terminating proxy the app sees plain HTTP, so honor X-Forwarded-Proto to recover the real
  # scheme. That drives HSTS in SecurityHeadersFilter. 'framework' uses Spring's ForwardedHeaderFilter (the
  # trusted-proxy strategy; the proxy must strip client-supplied X-Forwarded-*).
  forward-headers-strategy: framework

budgetspace:
  admin-endpoints:
    # Not public in production.
    enabled: ${BUDGETSPACE_ADMIN_ENDPOINTS_ENABLED:false}

app:
  cors:
    # No localhost fallback in prod: CORS_ALLOWED_ORIGINS must be set to the real frontend origin
    # (comma-separated for more than one). The app fails fast at startup if it is missing.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
