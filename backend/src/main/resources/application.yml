spring:
  application:
    name: kitiva-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/budgetspace}
    username: ${DATABASE_USERNAME:budgetspace}
    password: ${DATABASE_PASSWORD:budgetspace}
    hikari:
      # Size the pool for load and fail fast under saturation instead of piling requests up.
      # connection-timeout caps how long a request waits for a free connection before erroring, so a spike
      # degrades gracefully rather than hangs.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      # Dev rebuilds the schema on each start. The only mapped entity is nail_feedback, and the product
      # catalogs are JSON resources compiled into the jar rather than database rows — so there is nothing
      # in dev worth preserving across a restart. Prod overrides this to `validate`; do not change that.
      ddl-auto: ${HIBERNATE_DDL_AUTO:create}
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      # There is no data.sql and there must not be: every product this app shows comes from a captured
      # retailer feed, never from a seed file someone typed.
      mode: ${SPRING_SQL_INIT_MODE:never}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  flyway:
    # Dev keeps the fast ddl-auto=create flow, so Flyway is OFF here. Production turns it ON
    # (application-prod.yml) with ddl-auto=validate, where Flyway owns the schema.
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Never expose internals on an error body. Spring Boot's own default is already 'never', but DevTools (on
  # the dev classpath) flips include-stacktrace/message to ALWAYS — which leaked a full filter-chain stack
  # trace on a malformed CORS Origin, i.e. a 500 thrown inside a servlet filter that bypasses both the
  # Tomcat ErrorReportValve and the @RestControllerAdvice. Pinned closed here for every profile.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  # gzip the API responses. The catalog browse response is the heavy payload — 48 products with
  # descriptions and shade lists — so compressing it cuts transfer substantially over mobile links. Tomcat
  # only compresses at/above min-response-size, so small JSON is left alone. The frontend's static bundle
  # is already gzipped by nginx (frontend/nginx.conf); this covers the dynamic API side.
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,image/svg+xml
    min-response-size: 1024

management:
  # ONLY health (liveness + readiness) for host/load-balancer probes — nothing else on the public surface.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

budgetspace:
  admin-endpoints:
    # Off by default; prod pins it off explicitly too.
    enabled: ${BUDGETSPACE_ADMIN_ENDPOINTS_ENABLED:false}
  # Rate limiting and the trusted-proxy count are read straight from @Value defaults in
  # config/RateLimitFilter, so they only need to appear here to override them.
