<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitiva — nokti i šminka, stvarni proizvodi iz hrvatskih trgovina</title>
    <meta
      name="description"
      content="Opiši kakve nokte ili šminku želiš. Dobiješ popis stvarnih proizvoda iz hrvatskih trgovina s cijenama — ili pošteno objašnjenje što se kod nas ne može kupiti."
    />
    <meta name="robots" content="index,follow" />
    <!-- No <link rel="canonical"> and no og:url: Kitiva has no public URL yet, and the ones that stood here
         pointed at budgetspaceai.com — which told search engines this page was a copy of a different product on
         a different domain. Add both together, with the real host, on the day there is one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F3EDE4" />
    <!-- Open Graph — no og:image: there is no stable, public share image to point at yet (the in-app banner is a
         hashed bundle asset, and the favicon is not a share image). Omitted rather than fabricated. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kitiva — nokti i šminka, stvarni proizvodi iz hrvatskih trgovina" />
    <meta
      property="og:description"
      content="Opiši kakve nokte ili šminku želiš. Dobiješ popis stvarnih proizvoda iz hrvatskih trgovina s cijenama — ili pošteno objašnjenje što se kod nas ne može kupiti."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kitiva — nokti i šminka, stvarni proizvodi iz hrvatskih trgovina" />
    <meta
      name="twitter:description"
      content="Opiši kakve nokte ili šminku želiš. Dobiješ popis stvarnih proizvoda iz hrvatskih trgovina s cijenama — ili pošteno objašnjenje što se kod nas ne može kupiti."
    />
    <!-- Only Inter, and only because it sits in the --nk-sans fallback chain for machines without Segoe UI.
         Bricolage Grotesque and Playfair Display were also loaded here and are referenced by nothing in the
         beauty CSS — three render-blocking families fetched from Google before the consent banner has said a
         word, for one that is occasionally used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
